name: Build Packages

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Allows manual trigger

jobs:
  build-windows:
    name: Build Windows MSI
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: Build Windows MSI
        run: ./gradlew packageMsi

      - name: Upload Windows MSI
        uses: actions/upload-artifact@v4
        with:
          name: DriveIt-Windows
          path: app/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error

  build-macos:
    name: Build macOS DMG
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: Build macOS DMG
        run: ./gradlew packageDmg

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: DriveIt-macOS
          path: app/build/compose/binaries/main/dmg/*.dmg
          if-no-files-found: error

  build-linux:
    name: Build Linux DEB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: Build Linux DEB
        run: ./gradlew packageDeb

      - name: Upload Linux DEB
        uses: actions/upload-artifact@v4
        with:
          name: DriveIt-Linux
          path: app/build/compose/binaries/main/deb/*.deb
          if-no-files-found: error

  create-release:
    name: Create Release
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/DriveIt-Windows/*.msi
            artifacts/DriveIt-macOS/*.dmg
            artifacts/DriveIt-Linux/*.deb
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
